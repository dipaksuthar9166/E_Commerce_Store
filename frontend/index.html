<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="google-site-verification" content="seIoYQRqXZ90ln1hbx3hMgjM3DdFzYPMgahoY0DmVbg" />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MERSKO" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Primary SEO -->
    <title>MERSKO — Online Store | Grocery, Daily Essentials & Fast Delivery</title>
    <meta
      name="description"
      content="Shop on MERSKO — online grocery, daily essentials and local products with fast delivery and best prices. Explore, buy, and get it delivered to your door."
    />
    <meta
      name="keywords"
      content="mersko, online store, online grocery, daily essentials, kirana online, local shops, fast delivery, mersko store"
    />
    <meta name="author" content="MERSKO" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://e-commerce-store-eta-lovat.vercel.app/" />

    <!-- Open Graph (WhatsApp / Facebook / LinkedIn share preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MERSKO" />
    <meta property="og:title" content="MERSKO — Online Store | Grocery & Daily Essentials" />
    <meta
      property="og:description"
      content="Order grocery and daily essentials online from MERSKO. Fast delivery and best prices."
    />
    <meta property="og:url" content="https://e-commerce-store-eta-lovat.vercel.app/" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MERSKO — Online Store | Grocery & Daily Essentials" />
    <meta
      name="twitter:description"
      content="Order grocery and daily essentials online from MERSKO. Fast delivery and best prices."
    />

    <!-- Faster API cold-start: open connection while HTML parses -->
    <link rel="dns-prefetch" href="https://e-commerce-store-kto6.onrender.com" />
    <link rel="preconnect" href="https://e-commerce-store-kto6.onrender.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    </noscript>
    <!-- Wake Render free tier ASAP (before React boots) -->
    <script>
      (function () {
        try {
          fetch('https://e-commerce-store-kto6.onrender.com/api/health', {
            method: 'GET',
            mode: 'cors',
            cache: 'no-store',
          }).catch(function () {});
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
